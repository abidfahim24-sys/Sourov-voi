      background-position: 0 0, 11px 11px;
      opacity: 0.12;

    /* Speech Bubble */
    .speech-bubble {
      position: relative;
      background: #ffffff;
      border: 4px solid #1e272e;
      box-shadow: 5px 5px 0px #1e272e;
      border-radius: 24px;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 16px 14px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 20px 17px 0;
      border-style: solid;
      border-color: #1e272e transparent;
      display: block;
      width: 0;

    .comic-btn {

    /* Animations */
    @keyframes angry-shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-3px, 2px) rotate(-1.5deg); }
      40% { transform: translate(3px, -2px) rotate(1.5deg); }
      60% { transform: translate(-3px, -1px) rotate(-1deg); }
      80% { transform: translate(3px, 1px) rotate(1deg); }
    }

    .shake-angry {

    @keyframes dog-bark {
      0% { transform: scale(1) translateY(0); }
      35% { transform: scale(1.08, 0.92) translateY(-14px) rotate(-4deg); }
      65% { transform: scale(0.96, 1.04) translateY(-2px) rotate(3deg); }
      100% { transform: scale(1) translateY(0); }
    }

    .dog-barking {
      animation: dog-bark 0.38s ease-in-out;

    @keyframes pop-bounce {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      70% { transform: scale(1.12) rotate(4deg); opacity: 1; }

  <script>
    // Web Audio Synthesizer (Instant playable sound FX without external assets)
    let audioCtx = null;
    let isSoundMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    const AudioEngine = {
      pop() {
        if (isSoundMuted) return;
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      },

      poof() {
        if (isSoundMuted) return;
        initAudio();
        // White noise burst for smoke explosion
        const bufferSize = audioCtx.sampleRate * 0.25;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.07));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(850, audioCtx.currentTime);
        filter.frequency.linearRampToValueAtTime(140, audioCtx.currentTime + 0.25);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();

        // Comic falling tone
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(85, audioCtx.currentTime + 0.28);
        oscGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.28);
      },

      bark(pitch = 280) {
        if (isSoundMuted) return;
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 0.5, now + 0.15);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, now);
        filter.Q.setValueAtTime(2.2, now);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.65, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.18);
      },

      sparkle() {
        if (isSoundMuted) return;
        initAudio();
        const now = audioCtx.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          gain.gain.setValueAtTime(0.2, now + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.05);
          osc.stop(now + idx * 0.05 + 0.26);
        });
      }
    };

    // Canvas Particle Smoke & Star Bursts
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, type = 'smoke') {
        this.x = x;
        this.y = y;
        this.type = type;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 1;
        this.life = 1.0;
        this.decay = Math.random() * 0.025 + 0.02;
        this.size = type === 'smoke' ? Math.random() * 22 + 14 : Math.random() * 8 + 6;
        this.color = type === 'smoke' 
          ? ['#ffffff', '#f1f2f6', '#dfe4ea', '#ffa502'][Math.floor(Math.random() * 4)]
          : ['#ffd32a', '#2ed573', '#ff4757', '#1e90ff'][Math.floor(Math.random() * 4)];
        this.emoji = type === 'emoji' ? ['🦴', '🐶', '🐾', '✨', '💨'][Math.floor(Math.random() * 5)] : null;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05;
        this.life -= this.decay;
        if (this.type === 'smoke') this.size += 0.35;
      }

      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.life);
        if (this.emoji) {
          c.font = `${Math.floor(this.size * 2)}px Arial`;
          c.fillText(this.emoji, this.x, this.y);
        } else {
          c.fillStyle = this.color;
          c.beginPath();
          c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          c.fill();
        }
        c.restore();
      }
    }

    function createParticleBurst(x, y, isSparkle = false) {
      for (let i = 0; i < 30; i++) {
        const type = isSparkle 
          ? (Math.random() > 0.4 ? 'sparkle' : 'emoji') 
          : (Math.random() > 0.3 ? 'smoke' : 'emoji');
        particles.push(new Particle(x, y, type));
      }
    }

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // Gameplay Logic
    const speechBox = document.getElementById('speech-box');
    const dialogueText = document.getElementById('dialogue-text');
    const sourovHuman = document.getElementById('sourov-human');
    const sourovDog = document.getElementById('sourov-dog');
    const dogHeadGroup = document.getElementById('dog-head-group');
    const barkWaves = document.getElementById('bark-waves');
    const btnKucho = document.getElementById('btn-kucho');
    const btnPanu = document.getElementById('btn-panu');
    const counterEl = document.getElementById('counter');
    const soundBtn = document.getElementById('sound-btn');
    const soundIconOn = document.getElementById('sound-icon-on');
    const soundIconOff = document.getElementById('sound-icon-off');

    let trapCounter = 0;
    let isDogMode = false;
    let barkLoop = null;

    const angryBengaliQuotes = [
      "আমাকে কুচো ডাকবেনা খবর করে দিব! 😡💢",
      "আবার কুচো ডাকলে খবর আছে সৌরভের! 😤👊",
      "কুচো বললি কেন রে ভাই?! আমি প্রতিবাদী সৌরভ! 🛑🔥",
      "একদম কুচো বলবি না! মেজাজ গরম হচ্ছে! 🤬⚡"
    ];

    const barkBengaliQuotes = [
      "ভক ভক! ঘেউ ঘেউ! 🐶💢",
      "ভউউউ! ভক ভক ভক! 🐾",
      "ঘেউউউ! আমাকে আর কুচো ডাকিস না ভক! 🐶💥",
      "ভক ভক! ঘেউ ঘেউ! বাউ ওয়াউ! 🦴"
    ];

    const recoveryBengaliQuotes = [
      "যাহ্! বাংলা পানু খেয়ে বেঁচে গেলাম! 😮‍💨✨",
      "আরেহ্! আমি তো মানুষ হয়ে গেলাম! আর কুচো ডাকবি না! 😤🔥",
      "উফ্ শান্তি! অবশেষে মুক্তি পেলাম! 🙌💫"
    ];

    // Sound toggle
    soundBtn.addEventListener('click', () => {
      isSoundMuted = !isSoundMuted;
      if (isSoundMuted) {
        soundIconOn.classList.add('hidden');
        soundIconOff.classList.remove('hidden');
      } else {
        soundIconOn.classList.remove('hidden');
        soundIconOff.classList.add('hidden');
        initAudio();
      }
    });

    function triggerDogBark() {
      if (!isDogMode) return;
      AudioEngine.bark(260 + Math.random() * 80);
      dialogueText.textContent = barkBengaliQuotes[Math.floor(Math.random() * barkBengaliQuotes.length)];
      
      dogHeadGroup.style.transform = 'translateY(-12px) rotate(-3deg)';
      barkWaves.classList.remove('opacity-0');
      barkWaves.classList.add('opacity-100');

      setTimeout(() => {
        dogHeadGroup.style.transform = 'translateY(0px) rotate(0deg)';
        barkWaves.classList.remove('opacity-100');
        barkWaves.classList.add('opacity-0');
      }, 160);
    }

    // Step 1: Click "কুচো"
    btnKucho.addEventListener('click', () => {
      initAudio();
      AudioEngine.pop();
      AudioEngine.poof();

      trapCounter++;
      counterEl.textContent = trapCounter;

      const rect = sourovHuman.getBoundingClientRect();
      createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, false);

      // Hide Human, Show Dog
      sourovHuman.classList.add('hidden');
      sourovDog.classList.remove('hidden');
      sourovDog.classList.add('flex');
      isDogMode = true;

      btnKucho.classList.add('hidden');

      dialogueText.textContent = "ভক ভক! ঘেউ ঘেউ! 🐶🔥";

      triggerDogBark();
      setTimeout(triggerDogBark, 380);

      if (barkLoop) clearInterval(barkLoop);
      barkLoop = setInterval(triggerDogBark, 1400);

      // Show "বাংলা পানু"
      setTimeout(() => {
        if (isDogMode) {
          btnPanu.classList.remove('hidden');
          btnPanu.classList.add('flex');
          AudioEngine.pop();
        }
      }, 600);
    });

    // Step 2: Click "বাংলা পানু"
    btnPanu.addEventListener('click', () => {
      initAudio();
      AudioEngine.pop();
      AudioEngine.sparkle();

      if (barkLoop) clearInterval(barkLoop);

      const rect = sourovDog.getBoundingClientRect();
      createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, true);

      // Hide Dog, Restore Human
      sourovDog.classList.add('hidden');
      sourovDog.classList.remove('flex');
      sourovHuman.classList.remove('hidden');
      isDogMode = false;

      btnPanu.classList.add('hidden');
      btnPanu.classList.remove('flex');
      btnKucho.classList.remove('hidden');

      dialogueText.textContent = recoveryBengaliQuotes[Math.floor(Math.random() * recoveryBengaliQuotes.length)];

      setTimeout(() => {
        if (!isDogMode) {
          dialogueText.textContent = angryBengaliQuotes[Math.floor(Math.random() * angryBengaliQuotes.length)];
        }
      }, 2400);
    });

    // Direct Character Poke Easter Eggs
    sourovHuman.addEventListener('click', () => {
      AudioEngine.pop();
      dialogueText.textContent = "গায়ে হাত দিবি না! খবর আছে বলে দিলাম! 😠";
      sourovHuman.classList.add('shake-angry');
      setTimeout(() => sourovHuman.classList.remove('shake-angry'), 400);
    });

    sourovDog.addEventListener('click', () => {
      triggerDogBark();
    });
  </script>
